# Build-only scaffold; deployment stages come later.
trigger:
  - main

pool:
  name: Laboratory-Apps-Build

steps:
  - powershell: |
      Write-Host "Checking Docker version..."
      docker --version

      Write-Host "Checking Docker engine..."
      docker info

      Write-Host "Testing Docker container..."
      docker run --rm hello-world
    displayName: 'Verify Docker Build Agent'
