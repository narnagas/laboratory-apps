# Build-only scaffold; deployment stages come later.
trigger:
  branches:
    include: [development]

pr:
  branches:
    include: [development]

pool:
  name: Laboratory-Apps-Build

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'

  - script: |
      npm install --no-audit --no-fund
      npm run build
    displayName: 'Install and build Angular'

  - powershell: |
      Write-Host "Build source directory:"
      Write-Host "$(Build.SourcesDirectory)"

      Write-Host "Checking dist directory..."

      $distPath = "$(Build.SourcesDirectory)\dist"

      if (Test-Path $distPath) {
        Get-ChildItem $distPath -Recurse |
          Select-Object FullName
      }
      else {
        throw "dist directory does not exist."
      }
    displayName: 'Verify Angular Build Output'

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist/laboratory/browser'
      artifact: 'angular-browser'
      publishLocation: 'pipeline'

