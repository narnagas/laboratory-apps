# Build-only scaffold; deployment stages come later.

# Laboratory Apps - Development Build Pipeline
# Build-only scaffold; deployment stages come later.

trigger:
  branches:
    include: [development]

pr:
  branches:
    include: [development]

pool:
  name: Laboratory-Apps-Build

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: 'Install Node.js 22'
    inputs:
      versionSpec: '22.x'

  - powershell: |
      $ErrorActionPreference = "Stop"

      Write-Host "Installing dependencies..."
      npm install --no-audit --no-fund

      if ($LASTEXITCODE -ne 0) {
        throw "npm install failed"
      }

      Write-Host "Building Angular development configuration..."
      npm run build:dev

      if ($LASTEXITCODE -ne 0) {
        throw "Angular development build failed"
      }

      Write-Host "Checking generated build folders..."
      Get-ChildItem "$(Build.SourcesDirectory)\dist" -Recurse |
        Select-Object FullName

    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'Install and Build Angular (Development)'

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Angular Browser'
    inputs:
      targetPath: '$(Build.SourcesDirectory)/dist/laboratory/browser'
      artifact: 'angular-browser'
      publishLocation: 'pipeline'
